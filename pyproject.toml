[project]
name = "project-database"
version = "0.1.0"
description = "Database used to keeping track of project statuses"
readme = "README.md"
authors = [
    { name = "SIPB", email = "sipb-projectdb@mit.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
project-database = "project_database:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
