<nav class="navigation" aria-label="Primary navigation">
    {% if not user %}
    <a href="{{ authlink }}">Sign In</a>
    {% else %}
    <span>Signed in as {{ user }}</span>
    <form action="{{ deauthlink }}" method="get">
        <input hidden name="action" value="logout" />
        <button type="submit">Sign out</button>
    </form>
    {% endif %}
    <form action="projectlist" method="get">
        <button type="submit">Project List</button>
    </form>
    {% if can_add %}
    <form action="addproject" method="get">
        <button type="submit">Add Project</button>
    </form>
    {% endif %}
    <form action="faq" method="get">
        <button type="submit">FAQ</button>
    </form>
</nav>
